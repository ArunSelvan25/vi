<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Property Manager</title>
  <meta name="description" content="Property and tenancy management: leases, rent, invoices and payments.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#21420d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">

  <!-- Installable on a phone: the manifest supplies the name, colours and
       icons; iOS ignores it and needs its own tags below. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Property">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- The module graph is three imports deep, which a browser otherwise
       discovers one level per round trip. Listing it lets a first visit fetch
       every module at once. test/pwa-test.mjs keeps this in step with sw.js. -->
  <link rel="modulepreload" href="assets/js/app.js">
  <link rel="modulepreload" href="assets/js/api.js">
  <link rel="modulepreload" href="assets/js/config.js">
  <link rel="modulepreload" href="assets/js/pwa.js">
  <link rel="modulepreload" href="assets/js/router.js">
  <link rel="modulepreload" href="assets/js/schema.js">
  <link rel="modulepreload" href="assets/js/store.js">
  <link rel="modulepreload" href="assets/js/ui.js">
  <link rel="modulepreload" href="assets/js/components/charts.js">
  <link rel="modulepreload" href="assets/js/components/detail.js">
  <link rel="modulepreload" href="assets/js/components/form.js">
  <link rel="modulepreload" href="assets/js/components/hovercard.js">
  <link rel="modulepreload" href="assets/js/components/table.js">
  <link rel="modulepreload" href="assets/js/views/billing.js">
  <link rel="modulepreload" href="assets/js/views/crud.js">
  <link rel="modulepreload" href="assets/js/views/dashboard.js">
  <link rel="modulepreload" href="assets/js/views/details.js">
  <link rel="modulepreload" href="assets/js/views/invoices.js">
  <link rel="modulepreload" href="assets/js/views/leases.js">
  <link rel="modulepreload" href="assets/js/views/onboarding.js">
  <link rel="modulepreload" href="assets/js/views/records.js">
  <link rel="modulepreload" href="assets/js/views/reports.js">
  <link rel="modulepreload" href="assets/js/views/settings.js">
</head>
<body>
  <div id="app">
    <div class="auth-screen">
      <div class="loading"><div class="spinner"></div><span>Starting…</span></div>
    </div>
  </div>
  <noscript>
    <p style="padding:2rem;font-family:system-ui">This application needs JavaScript enabled.</p>
  </noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
