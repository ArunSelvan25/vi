<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Property Manager</title>
  <meta name="description" content="Property and tenancy management running on Google Sheets.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#21420d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">

  <!-- Installable on a phone: the manifest supplies the name, colours and
       icons; iOS ignores it and needs its own tags below. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Property">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="app">
    <div class="auth-screen">
      <div class="loading"><div class="spinner"></div><span>Starting…</span></div>
    </div>
  </div>
  <noscript>
    <p style="padding:2rem;font-family:system-ui">This application needs JavaScript enabled.</p>
  </noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
