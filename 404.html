<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // GitHub Pages serves this for unknown paths; the app itself uses hash
    // routing, so just bounce back to the entry point.
    location.replace(location.pathname.replace(/\/[^/]*$/, '/') + '#/dashboard');
  </script>
</head>
<body><p>Redirecting…</p></body>
</html>
