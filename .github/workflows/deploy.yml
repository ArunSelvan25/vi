name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every action is pinned to a commit, not a tag: the deploy job holds the
# Supabase access token and database password, and a tag can be moved.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push waits for the run in progress rather than cancelling it:
# cancelling part-way through a database migration is never safe.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres: every suite, the browser ones included, runs the
    # real backend against it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:pw@localhost:55432/postgres
      # the runner ships with Chrome pre-installed
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Billing logic tests
        run: npm run test:backend
      - name: Lease occupant tests
        run: npm run test:occupants
      - name: Server-side paging tests
        run: npm run test:paging
      - name: Security tests
        run: npm run test:security
      - name: Production-readiness tests
        run: npm run test:production
      - name: HTTP and database-access tests
        run: npm run test:http
      - name: Installable-app checks
        run: npm run test:pwa
      - name: Browser smoke tests
        run: npm run test:ui
      - name: Mobile layout tests
        run: npm run test:responsive
      - name: Installable-app browser tests
        run: npm run test:pwa:ui

  # The database and the API function, before the site that talks to them.
  # Migrations are applied first: every one so far only adds, and a function
  # that expects a new column must not go live before the column exists.
  # Needs three repository secrets — see docs/SETUP.md.
  backend:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Stop rather than publish a site ahead of a database it has not updated.
      - name: Check the Supabase secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$SUPABASE_PROJECT_ID" ]   || missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0
      - name: Migrations waiting to run
        run: supabase db push --dry-run --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Run database migrations
        run: supabase db push --yes --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy the API function
        run: supabase functions deploy api --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_ID"

  deploy:
    needs: [test, backend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      # Optional: set a VIPM_API_URL repository secret to skip the setup wizard
      # on every device. The URL is written into the published site, so it is
      # visible to anyone who loads the page — this only keeps it out of git.
      # Pair it with a SETUP_KEY secret on the Supabase function. See docs/SETUP.md.
      - name: Inject API URL from repository secret
        env:
          VIPM_API_URL: ${{ secrets.VIPM_API_URL }}
        run: node scripts/set-api-url.mjs
      # Gives the service worker a new identity so installed devices pick this
      # release up instead of serving the last one from cache.
      - name: Stamp service worker build
        run: node scripts/stamp-build.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # the whole repo is the site — there is no build step
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
